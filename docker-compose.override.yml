# Docker Compose overrides for local development
# Automatically merged with docker-compose.yml when running `docker compose up`

version: "3.9"

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DEBUG: "true"
      DATABASE_ECHO: "false"

  frontend:
    command: npm run dev -- --host 0.0.0.0

  celery_worker:
    command: celery -A app.tasks.celery_app worker --loglevel=debug --queues=executions,ai --concurrency=1

